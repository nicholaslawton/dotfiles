general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 300                               # 5 minutes
    on-timeout = brightnessctl --save set 30%   # dim screen as warning
    on-resume = brightnessctl --restore
}

listener {
    timeout = 310                               # ten seconds after dimming
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                                   # thirty seconds after dimming
    on-timeout = hyprctl dispatch dpms off                          # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on && brightnessctl --restore # screen on when activity is detected after timeout has fired.
}

